[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-workshop"
version = "0.1.0"
description = "Copywriter Committee: one topic in, Baghdadi-Iraqi scripts out at three depth levels for Instagram and TikTok."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.3.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
content-workshop = "content_workshop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_workshop = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
